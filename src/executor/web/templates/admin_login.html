{% extends "base.html" %}
{% block title %}后台管理登录{% endblock %}
{% block content %}
<div class="login-wrap">
<div class="card">
  <h1>后台管理登录</h1>
  {% if not configured %}<div class="error">后台未配置管理员账号，请先在 .env 设置 ADMIN_USERNAME / ADMIN_PASSWORD_HASH。</div>{% endif %}
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login">
    <label>用户名</label>
    <input type="text" name="username" autocomplete="username" required>
    <label>密码</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <p><button type="submit">登录</button></p>
  </form>
  <p class="muted">仅后台管理员使用；普通用户请从飞书入口登录。</p>
</div>
</div>
{% endblock %}
