<div class="row">
  <div>
    <label>申请周期</label>
    <div class="actions">
      <label><input type="radio" name="period_type" value="temp" checked> 临时</label>
      <label><input type="radio" name="period_type" value="long"> 长期</label>
    </div>
  </div>
  <div>
    <label>临时期限</label>
    <select name="days">
      <option value="30">30 天</option>
      <option value="60">60 天</option>
      <option value="90" selected>90 天</option>
      <option value="180">180 天</option>
    </select>
  </div>
</div>
