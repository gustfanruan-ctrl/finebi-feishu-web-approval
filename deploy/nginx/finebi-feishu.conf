# FineBI × 飞书 自建 Web 审批（NGINX 反向代理）
# 安装位置：/etc/nginx/conf.d/finebi-feishu.conf
# 将 __DOMAIN__ 替换为实际域名；证书可用 certbot --nginx 自动配置。
#
# 注意：本应用只支持挂在根路径（页面里是 /requests/... 等绝对路径），
# 请用独立域名或子域名，不要挂在 https://example.com/finebi/ 子路径下。

# 客户环境 80/443 由 Docker NGINX 容器占用：
# - 主机不要安装/启动 NGINX；
# - Docker NGINX 的 upstream 用 http://172.23.39.93:18080；
# - 本文件仅作 host NGINX 场景参考（非本客户环境）。
upstream finebi_feishu_app {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 80;
    server_name __DOMAIN__;

    # 健康检查不经过业务逻辑
    location = /health {
        proxy_pass http://finebi_feishu_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://finebi_feishu_app;
        proxy_http_version 1.1;
        # 保留原始 Host：飞书 OAuth 回调/页面跳转都按 PUBLIC_BASE_URL 生成
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 10m;

        # 应用没有 WebSocket/SSE，无需 Upgrade 头；后续若加实时功能再打开
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }

    # TLS 由 certbot --nginx 自动追加；如需手工配置：
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
}
