[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finebi-feishu-executor"
version = "0.1.0"
description = "FineBI × 飞书 权限自动化执行器"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "PyMySQL>=1.1",
    "cryptography>=41",
    "requests>=2.31",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
executor = ["migrations/*.sql", "web/templates/*.html"]
